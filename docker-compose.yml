version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capital_guard_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./capital_guard.db
    volumes:
      - ./backend/data/cache:/app/data/cache
      - ./backend/capital_guard.db:/app/capital_guard.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: capital_guard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
